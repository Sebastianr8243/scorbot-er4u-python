[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scorbot-er4u"
version = "0.1.0"
description = "Python adapter for the original ScorBot ER-4U USB controller"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["mcap>=1.5,<2", "numpy>=1.26,<3", "pyusb>=1.2,<2"]

[project.optional-dependencies]
windows = ["libusb-package"]
gui = ["PyQt5>=5.15,<6"]

[tool.setuptools]
packages = ["scorbot", "scorbot.session", "openScorbot"]

[tool.setuptools.package-data]
openScorbot = ["*.ui", "*.png"]
"scorbot.session" = ["*.json"]
