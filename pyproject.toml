[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scorbot-er4u"
version = "0.1.0"
description = "Python control for the Intelitek ScorBot ER-4U arm through its vendor DLL"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
# Webcam capture (scorbot.camera.OpenCVSource and JPEG encoding).
camera = ["opencv-python-headless>=4.9,<5"]
dev = [
    "pytest>=9.0,<10",
    "pytest-xdist>=3.8,<4",
    "pytest-timeout>=2.4,<3",
    "coverage[toml]>=7.10,<8",
    "ruff==0.16.9",  # same version as .pre-commit-config.yaml, so local and CI agree
    "pre-commit>=4,<5",
    "opencv-python-headless>=4.9,<5",
]

[tool.setuptools]
packages = ["scorbot", "scorbot.camera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Runs the unittest tests unchanged; -n auto spreads them over CPU cores.
addopts = "-n auto --durations=5"
# Windows has no SIGALRM: the thread method turns a hang into a traceback.
timeout = 300
timeout_method = "thread"

[tool.coverage.run]
source = ["scorbot"]
# Also measure the example scripts' use of scorbot when tests run them.
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff.lint]
# Correctness rules (ruff defaults) plus flake8-bugbear, pinned so a personal
# ruff config cannot change them. B905 (zip strict=) is left out: it is style here.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B905"]
