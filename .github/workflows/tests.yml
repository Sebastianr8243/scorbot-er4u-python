name: Tests

# Pushes to main and stack2 and every pull request, on the robot PC's OS (Windows) and Linux, at the
# oldest and newest supported Python. The suite never opens USB or moves the arm.
on:
  push:
    branches: [main, stack2]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request replaces the run still going.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        shell: bash
    env:
      # Python 3.12+ can trace through sys.monitoring: coverage then costs almost nothing.
      # Empty on 3.10, where coverage uses its default tracer.
      COVERAGE_CORE: ${{ matrix.python-version == '3.13' && 'sysmon' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The toolbox is large; one OS is enough for the kinematics cross-check.
      - run: python -m pip install -e ".[dev${{ matrix.os == 'ubuntu-latest' && ',kinematics' || '' }}]"
      - name: Lint (ruff, correctness rules)
        run: ruff check .
      - name: Documentation check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python scripts/check_docs.py
      # uv.lock pins the lab PC install; fail if pyproject.toml changed without it.
      - name: uv.lock matches pyproject.toml
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python -m pip install uv
          uv lock --check
      - run: python -m compileall -q scorbot openScorbot scripts examples tests tests_extra
      # tests/ is the lab-visit gate; tests_extra/ is everything off the first-trial path.
      # CI runs both so the extras do not rot.
      - name: Tests in parallel with coverage (pytest runs the unittest suite)
        run: |
          python -m coverage run -m pytest tests tests_extra
          python -m coverage combine
      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage — ${{ matrix.os }}, Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
          python -m coverage report
      # The lab PC runs `python -m unittest discover -s tests` (setup_windows.ps1), with no
      # conftest, so tests/ runs for real. tests_extra/ already ran under pytest above; here it
      # only has to import and load without pytest (a broken import would otherwise hide as a
      # _FailedTest until run).
      - name: Plain unittest still works
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        run: |
          python -m unittest discover -s tests
          python - <<'EOF'
          import unittest
          loader = unittest.TestLoader()
          def walk(suite):
              for item in suite:
                  yield from walk(item) if isinstance(item, unittest.TestSuite) else [item]
          tests = list(walk(loader.discover("tests_extra")))
          broken = [t.id() for t in tests if isinstance(t, unittest.loader._FailedTest)]
          assert tests and not broken and not loader.errors, (broken, loader.errors)
          print(f"tests_extra: {len(tests)} tests load under plain unittest")
          EOF
      - name: Synthetic session smoke test
        run: python examples/make_synthetic_session.py --root "${{ runner.temp }}/sessions"
      # The README quickstart: the arm API with no server and no hardware.
      - name: FakeArm quickstart
        run: python -c "from scorbot.bridge import FakeArm; a = FakeArm(); a.move_by(dz=20); assert a.where().z == 220"
